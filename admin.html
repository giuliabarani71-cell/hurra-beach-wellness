<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Prenotazioni · Beach Wellness</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B4F73" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06283A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Prenotazioni">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#FBF4E9;--card:#fff;--ink:#0E2E3F;--ink-2:#3F5A66;--muted:#7F8E91;--line:#E5D8C2;
  --sea:#0B4F73;--sea-2:#0E8FA6;--gold:#F2C14E;--gold-2:#E3A72F;--danger:#C8463A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071E2B;--card:#0D2C3D;--ink:#EAF4F3;--ink-2:#B5CACC;--muted:#7F9AA0;--line:#1C4356;--sea:#7FE3DA;--sea-2:#2FD0C8;--danger:#FF8A7A}}
:root[data-theme="dark"]{--bg:#071E2B;--card:#0D2C3D;--ink:#EAF4F3;--ink-2:#B5CACC;--muted:#7F9AA0;--line:#1C4356;--sea:#7FE3DA;--sea-2:#2FD0C8;--danger:#FF8A7A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost",-apple-system,Helvetica,Arial,sans-serif;font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
h1{margin:0;font-weight:300;font-size:clamp(22px,3vw,30px);letter-spacing:.1em;text-transform:uppercase}
h1 small{display:block;font-size:11px;letter-spacing:.22em;color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 18px;font:inherit;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn:hover{border-color:var(--sea-2)}
.btn-gold{background:linear-gradient(135deg,#FFD978,var(--gold) 45%,var(--gold-2));color:#3A2608;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.login{max-width:420px;margin:12vh auto 0;text-align:center}
.login p{color:var(--ink-2);margin:8px 0 18px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.err{color:var(--danger);min-height:1.5em;margin:10px 0 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:30px;font-weight:400;color:var(--sea)}
.stat span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.table{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:400;white-space:nowrap}
tr:last-child td{border-bottom:0}
td a{color:var(--sea-2)}
td.notes{max-width:280px;color:var(--ink-2)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.del:hover{color:var(--danger)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:700px){
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{border-bottom:1px solid var(--line);padding:10px 4px;position:relative}
  td{border:0;padding:3px 12px}
  td[data-l]::before{content:attr(data-l) " · ";color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  td.act{position:absolute;top:8px;right:6px}
}
</style>
</head>
<body>
<div class="wrap">

  <section class="card login" id="login">
    <h1>Prenotazioni<small>Caribbean Beach Wellness · 5 December</small></h1>
    <p>Area riservata agli amministratori di Hurra Events.</p>
    <form id="login-form">
      <input type="password" id="pw" placeholder="Password admin" autocomplete="current-password" required>
      <button class="btn btn-gold" type="submit" style="width:100%;justify-content:center">Entra</button>
    </form>
    <p class="err" id="login-err" role="alert"></p>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Prenotazioni<small>Caribbean Beach Wellness · Sabato 5 dicembre · Punta Popi</small></h1>
      <button class="btn" id="logout" type="button">Esci</button>
    </header>
    <div class="stats">
      <div class="stat"><b id="s-count">0</b><span>Prenotazioni</span></div>
      <div class="stat"><b id="s-people">0</b><span>Persone totali</span></div>
      <div class="stat"><b id="s-last">–</b><span>Ultima</span></div>
    </div>
    <div class="tools">
      <button class="btn btn-gold" id="csv" type="button">Scarica CSV (Excel)</button>
      <button class="btn" id="reload" type="button">Aggiorna</button>
    </div>
    <div class="table">
      <table>
        <thead><tr><th>Data</th><th>Nome</th><th>Telefono</th><th>E-mail</th><th>Persone</th><th>Note</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="err" id="app-err" role="alert"></p>
  </section>

</div>
<script>
(function(){
  var API = "https://hurra-bookings.giuliabarani71.workers.dev";
  var key = "", items = [];
  try { key = sessionStorage.getItem("hurra_admin") || ""; } catch(e){}
  var $ = function(id){ return document.getElementById(id); };

  function fmt(iso){
    var d = new Date(iso);
    return d.toLocaleString("it-IT", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function call(method, path){
    return fetch(API + path, {method: method, headers: {"Authorization": "Bearer " + key}})
      .then(function(r){ return r.json().then(function(j){ j._status = r.status; return j; }); });
  }

  function load(){
    $("app-err").textContent = "";
    return call("GET", "/admin/bookings").then(function(j){
      if (!j.ok) throw j;
      items = j.items; render();
      $("login").hidden = true; $("app").hidden = false;
    });
  }

  function render(){
    var people = items.reduce(function(n, b){ return n + (b.people || 1); }, 0);
    $("s-count").textContent = items.length;
    $("s-people").textContent = people;
    $("s-last").textContent = items[0] ? fmt(items[0].createdAt).replace(",", "") : "–";
    $("rows").innerHTML = items.length ? items.map(function(b){
      var tel = b.phone.replace(/[^\d+]/g, "");
      return "<tr>" +
        '<td data-l="Data">' + esc(fmt(b.createdAt)) + "</td>" +
        '<td data-l="Nome"><b style="font-weight:500">' + esc(b.name) + "</b></td>" +
        '<td data-l="Tel"><a href="https://wa.me/' + esc(tel.replace("+", "")) + '" target="_blank" rel="noopener">' + esc(b.phone) + "</a></td>" +
        '<td data-l="E-mail">' + (b.email ? '<a href="mailto:' + esc(b.email) + '">' + esc(b.email) + "</a>" : "–") + "</td>" +
        '<td data-l="Persone">' + esc(b.people) + "</td>" +
        '<td data-l="Note" class="notes">' + (esc(b.notes) || "–") + "</td>" +
        '<td class="act"><button class="del" title="Elimina" data-k="' + esc(b.key) + '">×</button></td>' +
      "</tr>";
    }).join("") : '<tr><td colspan="7" class="empty">Ancora nessuna prenotazione.</td></tr>';
  }

  function errText(j){
    if (j && j.error === "unauthorized") return "Password non corretta.";
    if (j && j.error === "locked") return "Troppi tentativi: riprova tra 15 minuti.";
    if (j && j.error === "admin_key_missing") return "Sul Worker manca la password admin (ADMIN_KEY).";
    return "Impossibile contattare il server. Riprova.";
  }

  $("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    key = $("pw").value; $("login-err").textContent = "";
    load().then(function(){ try { sessionStorage.setItem("hurra_admin", key); } catch(e){} })
      .catch(function(j){ $("login-err").textContent = errText(j); key = ""; });
  });

  $("logout").addEventListener("click", function(){
    key = ""; items = [];
    try { sessionStorage.removeItem("hurra_admin"); } catch(e){}
    $("app").hidden = true; $("login").hidden = false; $("pw").value = "";
  });

  $("reload").addEventListener("click", function(){ load().catch(function(j){ $("app-err").textContent = errText(j); }); });

  $("rows").addEventListener("click", function(e){
    var b = e.target.closest(".del"); if (!b) return;
    var it = items.find(function(x){ return x.key === b.dataset.k; });
    if (!confirm("Eliminare definitivamente la prenotazione di " + (it ? it.name : "") + "?")) return;
    call("DELETE", "/admin/bookings/" + encodeURIComponent(b.dataset.k)).then(function(j){
      if (!j.ok) throw j; return load();
    }).catch(function(j){ $("app-err").textContent = errText(j); });
  });

  $("csv").addEventListener("click", function(){
    var cols = [["createdAt","Data"],["name","Nome"],["phone","Telefono"],["email","E-mail"],["people","Persone"],["notes","Note"],["country","Paese"]];
    var q = function(v){ v = String(v == null ? "" : v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [cols.map(function(c){ return c[1]; }).join(";")].concat(items.map(function(b){
      return cols.map(function(c){ return q(c[0] === "createdAt" ? fmt(b.createdAt) : b[c[0]]); }).join(";");
    }));
    var blob = new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "prenotazioni-beach-wellness-" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });

  if (key) load().catch(function(){ key = ""; });
})();
</script>
</body>
</html>
